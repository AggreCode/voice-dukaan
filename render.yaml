# Render blueprint: one free web service (API + built web app) using a free Neon Postgres.
# Render's own free Postgres expires 30 days after creation, so the database lives on Neon instead.
services:
  - type: web
    name: voice-dukan
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./infra/app.Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL      # Neon: postgresql+asyncpg://USER:PASS@HOST/DB?ssl=require
        sync: false
      # Signs login tokens and PIN hashes. Render generates it once and keeps it across deploys.
      # It must NOT be derived from the AI keys: that is what made every token fail with
      # "invalid or expired token" the moment a key was added or rotated.
      - key: APP_SECRET
        generateValue: true
      - key: SARVAM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EXTRACTOR_MODE
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: VAD_BACKEND
        value: webrtc
      # Reading a photographed list. Same key and REST surface as the extractor, so no new secret.
      - key: OCR_MODE
        value: gemini
      - key: GEMINI_VISION_MODEL
        value: gemini-3.1-flash-lite
      - key: KEEP_IMAGES
        value: "false"        # photos are read in memory and dropped; nothing is stored
      - key: SARVAM_TRANSLATE_VIEW
        value: "false"
      - key: DATA_DIR
        value: /data
      - key: LOG_LEVEL
        value: INFO
