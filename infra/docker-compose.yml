services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vd
      POSTGRES_PASSWORD: vd
      POSTGRES_DB: voicedukan
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vd -d voicedukan"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://vd:vd@db:5432/voicedukan
      DATA_DIR: /data
    volumes:
      - ../data:/data
      - ../secrets:/secrets:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
      target: dev
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY: http://backend:8000
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  caddy_data:
