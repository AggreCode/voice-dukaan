[project]
name = "mo-dokan-backend"
version = "0.1.0"
description = "Mo Dokan: voice and photo sales & inventory ledger (Odia/Hindi/English)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  # [asyncio] pulls greenlet, which sqlalchemy.ext.asyncio needs at import time. Without the extra
  # the install succeeds and the app then fails to start on some Python/platform combinations.
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "anthropic>=1.4.0",
  "httpx>=0.27",
  "webrtcvad-wheels>=2.0.14",
  "numpy>=1.26",
  "soundfile>=0.12",
  "python-multipart>=0.0.9",
  "structlog>=24.1",
  "jiwer>=3.0",
  "orjson>=3.10",
]

[project.optional-dependencies]
# Best-quality voice detection, but torch makes the image ~1 GB. Production uses webrtcvad instead.
silero = ["silero-vad>=6.0", "onnxruntime>=1.17", "torch>=2.2", "torchaudio>=2.2"]
google = ["google-cloud-speech>=2.40.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "aiosqlite>=0.20", "ruff>=0.5"]
# A real PostgreSQL shipped as a wheel, for machines with no Docker. See scripts/devdb.py.
localdb = ["pgserver>=0.1.4"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007", "UP035", "UP006"]
